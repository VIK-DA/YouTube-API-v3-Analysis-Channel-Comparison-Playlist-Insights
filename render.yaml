services:
  - type: web
    name: youtube-comment-pulse
    runtime: python
    plan: free
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    # Claude's analysis can take up to a minute, so allow long requests
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MAX_COMMENTS
        value: "500"
